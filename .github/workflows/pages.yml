name: Publicar dashboard no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Montar o site estático
        run: python dashboard/web/build_site.py _site

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Teste no navegador
        working-directory: dashboard/web
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          mkdir -p capturas
          python -m http.server 8000 --directory "$GITHUB_WORKSPACE/_site" &
          sleep 2
          node smoke_test.mjs http://localhost:8000

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: dashboard/web/capturas

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
